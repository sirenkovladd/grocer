[env]
_.file = ".env"
GIT_COMMIT = "{{exec(command='git rev-parse --short HEAD')}}"

[settings]
task.output = "interleave"

[tasks.proto]
sources = ["proto/grocer.proto"]
outputs = ["proto/out_proto/*"]
run = "protoc --go_out=. --go_opt=paths=source_relative proto/grocer.proto && mv proto/grocer.pb.go proto/out_proto/"

[tasks.build_client]
run = [
  "rm -rf dist",
  "bunx vite build --config vite.config.ts --sourcemap=inline ./client",
]
outputs = ["dist/*"]
sources = ["client/*"]

[tasks.build_client_prod]
run = [
  "rm -rf dist",
  "bunx vite build --config vite.config.ts ./client",
]
outputs = ["dist/*"]
sources = ["client/*"]

[tasks.start_server]
depends = ["proto", "build_client"]
env.BUILD_TIME = "{{exec(command='date -u +%Y-%m-%dT%H:%M:%SZ')}}"
run = "go run ./cmd/server"
sources = ["**/*.go"]

[tasks.build_server]
depends = ["proto", "build_client_prod"]
env.GIT_COMMIT = "{{exec(command='git rev-parse --short HEAD')}}"
env.BUILD_TIME = "{{exec(command='date -u +%Y-%m-%dT%H:%M:%SZ')}}"
env.FLAG = "-s -w -X 'main.GitCommit={{env.GIT_COMMIT}}' -X 'main.BuildTime={{env.BUILD_TIME}}'"
run = "go build -ldflags '{{env.FLAG}}' -o ./dist/server ./cmd/server"
sources = ["**/*.go"]
outputs = ["dist/server"]

[tasks.create_user]
usage = '''
arg "<name>" help="Display name"
arg "<username>" help="Login username"
arg "<password>" help="Login password"
'''
run = "go run ./cmd/server --create-user --name \"{{ usage.name }}\" --username \"{{ usage.username }}\" --password \"{{ usage.password }}\""

[tasks.link_bot]
usage = '''
arg "<username>" help="Grocer username to link"
arg "<platform>" help="Bot platform" {
  choices "telegram" "discord"
}
arg "<id>" help="Platform user ID"
'''
run = "go run ./cmd/server --link-bot --username \"{{ usage.username }}\" --{{ usage.platform }} {{ usage.id }}"

[tasks.backup_export]
usage = 'arg "[output]" help="Snapshot output file" default="snapshot.pb.gz"'
run = "go run ./cmd/backup export \"{{ usage.output }}\""

[tasks.backup_import]
usage = 'arg "<file>" help="Snapshot file to import"'
run = "go run ./cmd/backup import \"{{ usage.file }}\""

[tasks.sync_costco]
run = "go run ./cmd/costco-sync"

[tasks.docker_build]
run = "docker build -f deploy/Dockerfile -t grocer ."

[tasks.docker_up]
run = "docker compose -f deploy/docker-compose.yml up"

[tasks.docker_down]
run = "docker compose -f deploy/docker-compose.yml down"

[tools]
bun = "latest"
go = "latest"
# protoc plugin for the `proto` task (protobuf codegen). Same `go:`
# backend pattern as the global config's gow entry.
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "latest"
